name: Docker-TestFlows-GitHub-Hetzner-Runners
run-name: ${{ github.actor }} triggered a GitHub Actions workflow that will run on Docker-TestFlows-GitHub-Hetzner-Runners
permissions:
  contents: read
  pull-requests: read
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  Build-and-Test-on-Docker-TestFlows-GitHub-Hetzner-Runners:
    runs-on: [self-hosted, type-cx22, image-x86-app-docker-ce]
    strategy:
      fail-fast: false
      matrix:
        FROM:
          - 'ubuntu:resolute'
          - 'ubuntu:questing'
          - 'ubuntu:noble'
          - 'linuxmintd/mint22.3-amd64'
          - 'linuxmintd/mint22.2-amd64'
          - 'linuxmintd/mint22-amd64'
          - 'dhi.io/python:3.13-debian13-sfw-dev'
          - 'opensuse/leap:16.0'
          - 'fedora:44'
          - 'fedora:43'
          - 'rockylinux/rockylinux:10.1'
        COMPILER:
          - 'gcc'
          - 'clang'
        preset-name:
          - 'linux-ninja-pie-enabled-RelWithDebInfo'
        build-type:
          - 'RelWithDebInfo'
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: false

      - name: Build and test
        env:
          FROM:       ${{ matrix.FROM }}
          COMPILER:   ${{ matrix.COMPILER }}
          IS_RELEASE: 0
        run: script/cibuild --preset_name=${{ matrix.preset-name }} --build_type=${{ matrix.build-type }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test_results_xml
          path: ${{github.workspace}}/test-results/**/*.xml
